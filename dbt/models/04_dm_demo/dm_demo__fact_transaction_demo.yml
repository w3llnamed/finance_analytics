version: 2

models:
  - name: dm_demo__fact_transaction_demo
    description: >
      Anonymized analytical mart for public demo dashboards.
      The model mirrors dm__fact_transaction but replaces real accounts
      and categories with demo values and masks transaction amounts using
      category-level masking parameters from the category_mapping_demo seed.
      Each transaction is expanded into five time grains (Day, Week, Month,
      Quarter, and Year) to support dynamic period selection and dashboard
      cross-filtering.

    columns:
      - name: transaction_date
        description: >
          Original transaction date and time.
        tests:
          - not_null

      - name: account
        description: >
          Anonymized demo account associated with the transaction.
        tests:
          - not_null

      - name: amount
        description: >
          Masked transaction amount.

      - name: amount_abs
        description: >
          Absolute masked transaction amount.

      - name: parent_category
        description: >
          Anonymized parent category of the transaction.

      - name: category
        description: >
          Anonymized detailed category of the transaction.

      - name: tags
        description: >
          Transaction tags removed from the demo mart for privacy.

      - name: note
        description: >
          Transaction note removed from the demo mart for privacy.

      - name: transaction_type
        description: >
          Transaction type.
        tests:
          - accepted_values:
              arguments:
                values: ['Transfer out', 'Transfer in', 'Expense', 'Income', 'Opening balance']

      - name: expense_type
        description: >
          Type of expense based on recurring and reserve-funded tags.
        tests:
          - accepted_values:
              arguments:
                values: ['Recurring', 'Reserve-funded', 'Ad hoc']

      - name: account_type
        description: >
          Account type based on reserve and credit account flags.
        tests:
          - accepted_values:
              arguments:
                values: ['Standard', 'Reserve', 'Credit']

      - name: period_grain
        description: >
          Time grain used for the categorical period representation.
          Each source transaction is represented once for every supported grain.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Day', 'Week', 'Month', 'Quarter', 'Year']

      - name: period
        description: >
          ISO-like categorical period label corresponding to period_grain,
          such as 2026-08-14, 2026-08-10, 2026-08, 2026-Q3, or 2026.
        tests:
          - not_null
