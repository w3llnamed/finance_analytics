version: 2

macros:
  - name: generate_schema_name
    description: >
      Overrides dbt's default schema naming logic.
      If +schema is defined for a model, that value is used without modification.
      Otherwise, target.schema is used.
      This macro is used to enforce a clean DWH architecture:
      raw / stg / core / dm.
    arguments:
      - name: custom_schema_name
        type: string
        description: >
          Schema value defined for the model via +schema
          (may be `none`).

      - name: node
        type: node
        description: >
          dbt model node object.
          Passed automatically and not used directly.
