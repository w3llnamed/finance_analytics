# seeds/seeds.yml
version: 2

seeds:
  - name: regular_expense_tag
    description: >
      Defines the tag that marks recurring expenses.
      Exactly one active record must exist.
      This constraint is validated by a singular dbt test.
    config:
      column_types:
        tag: varchar(50)
        is_active: boolean

    columns:
      - name: tag
        data_tests:
          - not_null
          - unique
          - active_seed_tags_exist_in_raw_tags:
              config:
                severity: warn
              arguments:
                raw_source_name: raw
                raw_table_name: money_flow
                raw_tags_column: tags
                separator: ','

      - name: is_active
        data_tests:
          - not_null

  - name: reserve_expense_tag
    description: >
      Defines the tag that marks reserve expenses.
      Exactly one active record must exist.
      This constraint is validated by a singular dbt test.
    config:
      column_types:
        tag: varchar(50)
        is_active: boolean

    columns:
      - name: tag
        data_tests:
          - not_null
          - unique
          - active_seed_tags_exist_in_raw_tags:
              config:
                severity: warn
              arguments:
                raw_source_name: raw
                raw_table_name: money_flow
                raw_tags_column: tags
                separator: ','

      - name: is_active
        data_tests:
          - not_null

  - name: dim_accounts
    description: >
      Reference dictionary of financial accounts.

      Contains account metadata, opening date, opening balance,
      currency and account classification flags used by downstream
      analytical models.
    config:
      column_types:
        account_id: integer
        account_name: varchar(50)
        opening_date: date
        initial_amount: numeric
        currency: varchar(10)
        is_active: boolean
        is_reserve: boolean
        is_credit: boolean

    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique

      - name: account_name
        data_tests:
          - not_null
          - unique

      - name: opening_date
        data_tests:
          - not_null

      - name: initial_amount
        data_tests:
          - not_null

      - name: currency
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - not_null

      - name: is_reserve
        data_tests:
          - not_null

      - name: is_credit
        data_tests:
          - not_null

  - name: dim_accounts_demo
    description: >
      Public demo account dictionary used by the anonymized demo analytics layer.

      This seed mirrors the structure of the private dim_accounts seed but
      contains synthetic account names and masked initial balances. It can be
      committed to version control and used for public dashboard publication.
    config:
      column_types:
        account_id: integer
        account_name: varchar(100)
        opening_date: date
        initial_amount: numeric
        currency: varchar(10)
        is_active: boolean
        is_reserve: boolean
        is_credit: boolean

    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique

      - name: account_name
        data_tests:
          - not_null
          - unique

      - name: opening_date
        data_tests:
          - not_null

      - name: initial_amount
        data_tests:
          - not_null

      - name: currency
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - not_null

      - name: is_reserve
        data_tests:
          - not_null

      - name: is_credit
        data_tests:
          - not_null
