name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Prepare CI environment
        run: cp infra/deploy/.env.example infra/deploy/.env

      - name: Start PostgreSQL
        working-directory: infra/deploy
        run: docker compose up -d --wait postgres

      - name: Prepare dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.yml.example ~/.dbt/profiles.yml

      - name: Prepare dbt environment
        run: |
          set -u
          source infra/deploy/.env

          echo "DBT_HOST=$PG_HOST" >> "$GITHUB_ENV"
          echo "DBT_PORT=$PG_PORT" >> "$GITHUB_ENV"
          echo "DBT_USER=dbt_runner" >> "$GITHUB_ENV"
          echo "DBT_DBNAME=$POSTGRES_DB" >> "$GITHUB_ENV"
          echo "DBT_RUNNER_PASSWORD=$DBT_RUNNER_PASSWORD" >> "$GITHUB_ENV"
          echo "DBT_ENABLE_DEMO=$DBT_ENABLE_DEMO" >> "$GITHUB_ENV"

      - name: Check dbt connection
        working-directory: dbt
        run: dbt debug --target ci

      - name: Prepare private dbt seed
        run: |
          cp dbt/seeds/private/dim_accounts.csv.example \
            dbt/seeds/private/dim_accounts.csv

      - name: Load synthetic raw data
        working-directory: infra/deploy
        run: |
          docker compose exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < ../../tests/ci/raw_money_flow.sql

      - name: Run dbt build
        working-directory: dbt
        run: dbt build --target ci
